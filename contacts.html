<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — ResumeBot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="top">
    <div class="wrap top-row">
      <div class="site-name">
        <img src="img/logo.svg" alt="Логотип ResumeBot: лист резюме с галочкой" width="32" height="32">
        <span>ResumeBot</span>
      </div>
      <ul class="menu">
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">О проекте</a></li>
        <li><a href="contacts.html">Контакты</a></li>
        <li><button type="button" id="themeToggle" class="theme-btn" aria-pressed="false">Тёмная тема</button></li>
      </ul>
    </div>
  </div>

  <div class="wrap page">
    <h1>Контакты</h1>
    <table class="info">
      <tr><td>Автор</td><td>Демин К. Д.</td></tr>
      <tr><td>Email</td><td><a href="mailto:resumebot@example.com">resumebot@example.com</a></td></tr>
      <tr><td>Университет</td><td>ВГУ, факультет компьютерных наук</td></tr>
    </table>

    <h2>Написать нам</h2>
    <form class="feedback" id="contactForm" action="#" method="post" novalidate>
      <p>
        <label for="name">Ваше имя:</label><br>
        <input type="text" id="name" name="name">
      </p>
      <p>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email">
      </p>
      <p>
        <label for="message">Сообщение:</label><br>
        <textarea id="message" name="message" rows="6"></textarea>
      </p>
      <input type="submit" value="Отправить">
      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="bottom">
    <div class="wrap">
      ResumeBot, 2026. Учебный проект, ВГУ ФКН, группа 15
    </div>
  </div>
</body>
</html>
